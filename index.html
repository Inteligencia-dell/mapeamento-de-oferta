<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel RSI</title>
</head>

<body>
  <h1>Painel RSI</h1>

  <p id="ultima-atualizacao">
    Carregando...
  </p>

  <script>
    fetch("./dados/status.json?v=" + Date.now())
      .then(function(response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        return response.json();
      })
      .then(function(data) {
        document.getElementById("ultima-atualizacao").textContent =
          "Última atualização: " + data.ultima_atualizacao;
      })
      .catch(function(error) {
        document.getElementById("ultima-atualizacao").textContent =
          "Erro ao carregar status.json";

        console.error(error);
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel RSI</title>
</head>

<body>

<h1>Painel RSI</h1>

<p id="ultima-atualizacao">
Carregando...
</p>

<script>

fetch('./dados/status.json')

.then(response => response.json())

.then(data => {

document.getElementById(
'ultima-atualizacao'
).innerHTML =
'Última atualização: ' +
data.ultima_atualizacao;

})

.catch(error => {

document.getElementById(
'ultima-atualizacao'
).innerHTML =
'Erro ao carregar';

console.error(error);

});

</script>

</body>
</html>

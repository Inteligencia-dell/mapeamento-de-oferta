name: Atualizar Dados RSI

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Atualizar dados
        env:
          RSI_API_URL: ${{ secrets.RSI_API_URL }}
        run: |
          python scripts/atualizar_ofertas.py

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Atualização automática RSI" || echo "Sem alterações"
          git push

name: Atualizar Dados Dashboard

on:
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Atualizar status.json
        run: |
          mkdir -p dados

          cat > dados/status.json << EOF
          {
            "ultima_atualizacao":"$(date '+%d/%m/%Y %H:%M')",
            "fonte":"GitHub Actions",
            "status":"ativo"
          }
          EOF

      - name: Commit alterações
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add dados/status.json

          git commit -m "Atualização automática status" || echo "Sem alterações"

          git push
